<?xml version="1.0" encoding="UTF-8"?>
<!-- K) 초승달 — 깊은 플럼/네이비 + 크림 크레센트. "잠들기 전 기록 / 떠오르는 기억" 추상. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="#3A2D4A"/>
  <!-- 크레센트: 큰 원에서 약간 오프셋된 원을 빼서 초승달 모양 -->
  <defs>
    <mask id="crescentMask">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <circle cx="600" cy="430" r="280" fill="black"/>
    </mask>
  </defs>
  <circle cx="500" cy="512" r="300" fill="#F4EFE5" mask="url(#crescentMask)"/>
  <!-- 작은 별 액센트 (4-pt 아님 — 그냥 점) -->
  <circle cx="780" cy="280" r="14" fill="#F4EFE5" opacity="0.7"/>
  <circle cx="240" cy="780" r="10" fill="#F4EFE5" opacity="0.5"/>
</svg>
