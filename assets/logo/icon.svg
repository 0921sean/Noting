<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 따뜻한 브라운 배경 (앱 primary 색상) -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="#7C5C3E"/>

  <!-- 미묘한 안쪽 하이라이트 (입체감) -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220"
        fill="url(#sheen)"/>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- 세리프 "N" — 크림색, 앱 메모 본문 폰트와 같은 결 -->
  <text x="512" y="720"
        text-anchor="middle"
        font-family="'Times New Roman', 'Noto Serif KR', serif"
        font-weight="700"
        font-size="640"
        fill="#FAF7F2"
        letter-spacing="-20">N</text>

  <!-- 4-pointed sparkle ✦ — 온보딩과 같은 모티프, 오른쪽 위 액센트 -->
  <g transform="translate(760, 280)" fill="#FAF7F2">
    <path d="M 0 -90 C 6 -35 35 -6 90 0 C 35 6 6 35 0 90 C -6 35 -35 6 -90 0 C -35 -6 -6 -35 0 -90 Z"/>
  </g>
</svg>
