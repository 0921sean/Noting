name: noting
description: "Remind-first personal note app. Capture thoughts, get surprised by them later."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^0.4.3+1
  path: ^1.9.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  flutter_timezone: ^1.0.4
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_fonts: ^6.2.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
