name: noting
description: "Remind-first personal note app. Capture thoughts, get surprised by them later."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  flutter_timezone: ^1.0.4
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_fonts: ^6.2.0
  http: ^1.2.2
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  supabase_flutter: ^2.12.4
  showcaseview: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Samanco
      fonts:
        - asset: assets/fonts/BinggraeSamanco-Bold.otf
          weight: 700
